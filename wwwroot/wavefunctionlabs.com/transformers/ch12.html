')?target[i]:CHARS[Math.random()*CHARS.length|0];el.textContent=out;el.style.filter=p<1?`blur(${((1-p)*4).toFixed(1)}px)`:'';el.style.color=p<1?`hsl(${hue+Math.round(p*8)},85%,${42+Math.round(p*30)}%)`:'';if(p<1)requestAnimationFrame(frame);else{el.style.filter='';el.style.color='';done&&done();}}requestAnimationFrame(frame);}function setLabels(m){if(wtfBtn){wtfBtn.innerHTML=m==='plain'?'<span>◎</span>&nbsp;tech':'<span>⁇</span>&nbsp;wtf?';wtfBtn.title=m==='plain'?'Back to technical':'Translate to plain English';}if(psiBtn){psiBtn.innerHTML=m==='psi'?'<span>ψ</span>&nbsp;back':'<span>ψ</span>&nbsp;deeper';psiBtn.title=m==='psi'?'Back to technical':'Amplify the metaphor';}if(duckBtn){duckBtn.innerHTML=m==='duck'?'<span>🦆</span>&nbsp;back':'<span>🦆</span>&nbsp;ducky';duckBtn.title=m==='duck'?'Back to technical':'Explain it in duck terms';}}function restoreTech(){activeEls.forEach(el=>{if(el.dataset.techHtml)el.innerHTML=el.dataset.techHtml;});activeEls=[];}function finish(){busy=false;wtfBtn&&wtfBtn.classList.remove('busy');psiBtn&&psiBtn.classList.remove('busy');duckBtn&&duckBtn.classList.remove('busy');}function switchTo(newMode){if(busy)return;busy=true;wtfBtn&&wtfBtn.classList.add('busy');psiBtn&&psiBtn.classList.add('busy');duckBtn&&duckBtn.classList.add('busy');if(mode!=='tech')restoreTech();mode=newMode;setLabels(mode);if(mode==='tech'){finish();return;}const els=mode==='plain'?plainEls:mode==='psi'?psiEls:duckEls;const attr=mode==='plain'?'data-plain':mode==='psi'?'data-psi':'data-duck';const hue=mode==='plain'?182:mode==='psi'?42:22;activeEls=els.slice();let done=0;els.forEach((el,i)=>{if(!el.dataset.techHtml)el.dataset.techHtml=el.innerHTML;const target=el.getAttribute(attr);const dur=Math.max(480,Math.min(target.length*3.8,1500));setTimeout(()=>decode(el,target,dur,hue,()=>{if(++done===els.length)finish();}),i*110);});}wtfBtn&&wtfBtn.addEventListener('click',()=>switchTo(mode==='plain'?'tech':'plain'));psiBtn&&psiBtn.addEventListener('click',()=>switchTo(mode==='psi'?'tech':'psi'));duckBtn&&duckBtn.addEventListener('click',()=>switchTo(mode==='duck'?'tech':'duck'));setLabels(mode);}async function inflate(targetId,dataId){const data=document.getElementById(dataId);if(!data||!('DecompressionStream' in window))return;const bytes=Uint8Array.from(atob(data.textContent.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const writer=ds.writable.getWriter();await writer.write(bytes);await writer.close();document.getElementById(targetId).innerHTML=await new Response(ds.readable).text();}document.addEventListener('DOMContentLoaded',async()=>{renderNav();await inflate('chapterBody','chapterBodyData');initTabs();initButtons();});</script><button id="wtf-btn"><span>⁇</span>&nbsp;wtf?</button><button id="psi-btn"><span>ψ</span>&nbsp;deeper</button><button id="duck-btn"><span>🦆</span>&nbsp;ducky</button></body></html>
