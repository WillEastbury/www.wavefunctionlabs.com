<script>
// ── Wave Canvas ──
const canvas = document.getElementById('waveCanvas');
const ctx = canvas.getContext('2d');
let w, h, t = 0;
const PHI = 1.618033988749;

function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
addEventListener('resize', resize);
resize();

function draw() {
    ctx.clearRect(0, 0, w, h);

    const waves = [
        { a: 50, f: 0.003, s: 0.012, c: 'rgba(99,102,241,0.10)', y: 0.5 },
        { a: 35, f: 0.005 * PHI, s: 0.018, c: 'rgba(168,85,247,0.06)', y: 0.55 },
        { a: 25, f: 0.004, s: -0.01 * PHI, c: 'rgba(6,182,212,0.06)', y: 0.45 },
        { a: 40, f: 0.002 * PHI, s: 0.007, c: 'rgba(240,192,64,0.03)', y: 0.62 },
    ];

    for (const wv of waves) {
        ctx.beginPath();
        ctx.moveTo(0, h);
        for (let x = 0; x <= w; x += 3) {
            const y = h * wv.y
                + Math.sin(x * wv.f + t * wv.s) * wv.a
                + Math.sin(x * wv.f * PHI + t * wv.s * 1.3) * wv.a * 0.35;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fillStyle = wv.c;
        ctx.fill();
    }

    // Probability density bars
    for (let x = 0; x < w; x += 4) {
        const p = Math.pow(Math.cos(x * 0.008 + t * 0.015) * Math.sin(x * 0.006 * PHI - t * 0.012), 2);
        ctx.fillStyle = `rgba(99,102,241,${p * 0.05})`;
        ctx.fillRect(x, h * 0.47 - p * 35, 2, p * 70);
    }

    t++;
    requestAnimationFrame(draw);
}
draw();

// ── Floating symbols ──
const syms = ['Ψ','φ','π','Σ','∫','∇','Δ','λ','Ω','ℏ','∞','∂','ζ','ε'];
const colors = ['#6366f1','#a855f7','#06b6d4','#f0c040'];
const field = document.getElementById('symField');

function spawn() {
    const el = document.createElement('span');
    el.className = 'sym';
    el.textContent = syms[Math.random() * syms.length | 0];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (10 + Math.random() * 22) + 'px';
    el.style.animationDuration = (14 + Math.random() * 22) + 's';
    el.style.color = colors[Math.random() * colors.length | 0];
    field.appendChild(el);
    setTimeout(() => el.remove(), 38000);
}
setInterval(spawn, 2200);
for (let i = 0; i < 6; i++) setTimeout(spawn, i * 350);
</script>

<script>
// ── WTF + PSI + Duck Buttons: Matrix decode toggles ──
// WTF (cyan) → plain English  |  ψ (gold) → deeper metaphor  |  🦆 (orange) → duck analogy
(function(){
    var CHARS='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモラリルレロABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=-|<>[]{}';
    function decode(el,target,dur,hue,done){
        var start=null,len=target.length;
        function frame(ts){
            if(!start)start=ts;
            var p=Math.min((ts-start)/dur,1),locked=Math.floor(p*len),out='';
            for(var i=0;i<len;i++){
                out+=(i<locked||target[i]===' '||target[i]==='\n')?target[i]:CHARS[Math.random()*CHARS.length|0];
            }
            el.textContent=out;
            el.style.filter=p<1?'blur('+((1-p)*4).toFixed(1)+'px)':'';
            el.style.color=p<1?('hsl('+(hue+Math.round(p*8))+',85%,'+(42+Math.round(p*30))+'%)'):'';
            p<1?requestAnimationFrame(frame):(el.style.filter=el.style.color='',done&&done());
        }
        requestAnimationFrame(frame);
    }
    function init(){
        var plainEls=Array.from(document.querySelectorAll('[data-plain]'));
        var psiEls=Array.from(document.querySelectorAll('[data-psi]'));
        var duckEls=Array.from(document.querySelectorAll('[data-duck]'));
        if(!plainEls.length&&!psiEls.length&&!duckEls.length)return;
        var mode='tech',busy=false,activeEls=[];
        var wtfBtn=null,psiBtn=null,duckBtn=null;
        if(plainEls.length){
            wtfBtn=document.createElement('button');
            wtfBtn.id='wtf-btn';
            wtfBtn.innerHTML='<span class="wtf-icon">⁇</span>&nbsp;wtf?';
            wtfBtn.title='Translate to plain English';
            document.body.appendChild(wtfBtn);
        }
        if(psiEls.length){
            psiBtn=document.createElement('button');
            psiBtn.id='psi-btn';
            psiBtn.innerHTML='<span class="psi-icon">ψ</span>&nbsp;deeper';
            psiBtn.title='Amplify the metaphor';
            document.body.appendChild(psiBtn);
        }
        if(duckEls.length){
            duckBtn=document.createElement('button');
            duckBtn.id='duck-btn';
            duckBtn.innerHTML='<span class="duck-icon">🦆</span>&nbsp;ducky';
            duckBtn.title='Explain it in duck terms';
            document.body.appendChild(duckBtn);
        }
        function setLabels(m){
            if(wtfBtn){wtfBtn.innerHTML=m==='plain'?'<span class="wtf-icon">◎</span>&nbsp;tech':'<span class="wtf-icon">⁇</span>&nbsp;wtf?';wtfBtn.title=m==='plain'?'Back to technical':'Translate to plain English';}
            if(psiBtn){psiBtn.innerHTML=m==='psi'?'<span class="psi-icon">ψ</span>&nbsp;back':'<span class="psi-icon">ψ</span>&nbsp;deeper';psiBtn.title=m==='psi'?'Back to technical':'Amplify the metaphor';}
            if(duckBtn){duckBtn.innerHTML=m==='duck'?'<span class="duck-icon">🦆</span>&nbsp;back':'<span class="duck-icon">🦆</span>&nbsp;ducky';duckBtn.title=m==='duck'?'Back to technical':'Explain it in duck terms';}
        }
        function restoreTech(){
            activeEls.forEach(function(el){if(el.dataset.techHtml)el.innerHTML=el.dataset.techHtml;});
            activeEls=[];
        }
        function switchTo(newMode){
            if(busy)return;
            busy=true;
            if(wtfBtn)wtfBtn.classList.add('busy');
            if(psiBtn)psiBtn.classList.add('busy');
            if(duckBtn)duckBtn.classList.add('busy');
            if(mode!=='tech')restoreTech();
            mode=newMode;
            setLabels(mode);
            if(mode==='tech'){busy=false;if(wtfBtn)wtfBtn.classList.remove('busy');if(psiBtn)psiBtn.classList.remove('busy');if(duckBtn)duckBtn.classList.remove('busy');return;}
            var els=mode==='plain'?plainEls:mode==='psi'?psiEls:duckEls;
            var attr=mode==='plain'?'data-plain':mode==='psi'?'data-psi':'data-duck';
            var hue=mode==='plain'?182:mode==='psi'?42:22;
            activeEls=els.slice();
            var total=els.length,done=0;
            els.forEach(function(el,i){
                if(!el.dataset.techHtml)el.dataset.techHtml=el.innerHTML;
                var target=el.getAttribute(attr);
                var dur=Math.max(480,Math.min(target.length*3.8,1500));
                setTimeout(function(){
                    decode(el,target,dur,hue,function(){
                        if(++done===total){busy=false;if(wtfBtn)wtfBtn.classList.remove('busy');if(psiBtn)psiBtn.classList.remove('busy');if(duckBtn)duckBtn.classList.remove('busy');}
                    });
                },i*110);
            });
        }
        if(wtfBtn)wtfBtn.addEventListener('click',function(){switchTo(mode==='plain'?'tech':'plain');});
        if(psiBtn)psiBtn.addEventListener('click',function(){switchTo(mode==='psi'?'tech':'psi');});
        if(duckBtn)duckBtn.addEventListener('click',function(){switchTo(mode==='duck'?'tech':'duck');});
    }
    document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();
})();
</script>
