apiVersion: apps/v1
kind: Deployment
metadata:
  name: wfl-www
  namespace: wfl-www
  labels:
    app: wfl-www
    env: prod
spec:
  # Single pod, two pinned worker threads, pinned to the dedicated
  # server node (vmss000005). The nodepool has a hard 2-node cost
  # limit: vmss000004 hosts load tests plus the low-traffic co-tenants,
  # vmss000005 hosts picoweb. A 2-pod Azure-LB round-robin layout would
  # need both pods on clean server nodes, which would require a third
  # node for the rest of the cluster. Until then, one pod +
  # SO_REUSEPORT inside the kernel does the cross-core distribution.
  replicas: 1
  strategy:
    # Inline kernel-socket TLS (no AF_XDP map contention any more), so
    # RollingUpdate is safe — fresh pod can bind :443 in its own netns
    # concurrently with the old one. maxUnavailable:0 + maxSurge:1 keeps
    # the site up across rolls.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wfl-www
  template:
    metadata:
      labels:
        app: wfl-www
        env: prod
    spec:
      # Dedicated server node: vmss000005 carries the hard taint
      # `dedicated=server:NoSchedule` and the label `role=server`.
      # Only picoweb tolerates that taint, and nodeSelector pins it to
      # that node. The rest of the low-traffic apps have tiny CPU
      # requests and bin-pack onto vmss000004 with the load-test pod.
      tolerations:
        - key: dedicated
          operator: Equal
          value: server
          effect: NoSchedule
      nodeSelector:
        role: server
      # Hardening: non-root + read-only rootfs + minimal caps. picoweb
      # binds :443 directly so it needs CAP_NET_BIND_SERVICE, and pins
      # its preallocated pool/arena/metrics via mlock so it needs
      # CAP_IPC_LOCK. NET_RAW/NET_ADMIN/BPF stay dropped — kernel-socket
      # TLS has no use for them; they were left over from the AF_XDP era.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wfl-www
          image: tileforgeacr.azurecr.io/wfl-www:p33-picowal-scores-1153
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 443
              name: https
          # Override the image entrypoint so the tuning knobs live in
          # git instead of drifting on the cluster.
          # Positional CLI: port wwwroot workers max_reqs zc_min pool_cap
          #   workers=2     — one per vCPU on the dedicated server node.
          #                   With nothing else competing for cores
          #                   (taint+nodeSelector keep co-tenants off
          #                   this node), each worker gets its own
          #                   SO_REUSEPORT accept queue and the kernel
          #                   hashes connections across both. Removes
          #                   the single-accept-loop head-of-line stall
          #                   that capped the colocated config at 42k.
          #   max_reqs=100  — per-connection request cap before close
          #                   (mild defence vs ticket-store growth).
          #   zc_min=0      — MSG_ZEROCOPY off; bodies fit in L2 so the
          #                   bookkeeping overhead would cost more than
          #                   the avoided memcpy.
          #   pool_cap=64   — preallocated per-worker conn table size.
          #                   64 × ~154 KiB ≈ 10 MiB resident per worker.
          #                   With 2 workers, total kconn allocation
          #                   is ~20 MiB resident.
          command: ["./picoweb"]
          args:
            - "--tls"
            - "--tls-cert=/certs/tls.crt"
            - "--tls-key=/certs/tls.key"
            - "--http-early-hints"
            - "--picowal-device=/data/picowal.wal"
            - "--picowal-prefix=/wal/"
            - "--picowal-bytes=10485760"
            - "443"
            - "wwwroot"
            - "2"
            - "100"
            - "0"
            - "64"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # NET_BIND_SERVICE: picoweb binds :443 directly.
              # IPC_LOCK: picoweb mlock()s the connection pool, response
              #   arena and metrics counters at startup so the working
              #   set is pinned (no swap, no reclaim, no minor faults on
              #   the hot path). Without this the mlock calls EPERM
              #   against the default 64KB RLIMIT_MEMLOCK and pages stay
              #   pageable — residency without pinning.
              add: ["NET_BIND_SERVICE", "IPC_LOCK"]
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: picowal-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Kernel-socket TLS is epoll-driven, not busy-polling, so
            # CFS throttling is no longer a hazard. CPU limit deliberately
            # left unset to preserve burst headroom. Memory covers
            # 2 workers × pool_cap=64 × ~154 KiB kconn_t (~20 MiB of
            # preallocated conn tables) + arena + crypto state.
            requests:
              cpu: 200m
              memory: 96Mi
            limits:
              memory: 192Mi
        # ---- HTTP -> HTTPS redirect sidecar -----------------------------
        # picoweb only listens on :443. Without something on :80, anyone
        # typing 'wavefunctionlabs.com' in a browser hits a 5+ second TCP
        # timeout before HSTS kicks in. Tiny nginx 301s everything.
        - name: redirect
          image: tileforgeacr.azurecr.io/nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/nginx/client_body /tmp/nginx/proxy /tmp/nginx/fastcgi /tmp/nginx/uwsgi /tmp/nginx/scgi
              cat >/tmp/nginx.conf <<'EOF'
              worker_processes 1;
              pid /tmp/nginx.pid;
              error_log /dev/stderr warn;
              events { worker_connections 256; }
              http {
                access_log off;
                client_body_temp_path /tmp/nginx/client_body;
                proxy_temp_path /tmp/nginx/proxy;
                fastcgi_temp_path /tmp/nginx/fastcgi;
                uwsgi_temp_path /tmp/nginx/uwsgi;
                scgi_temp_path /tmp/nginx/scgi;
                server {
                  listen 8080 default_server;
                  server_name _;
                  return 301 https://$host$request_uri;
                }
              }
              EOF
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              httpHeaders:
                - name: Host
                  value: wavefunctionlabs.com
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
      volumes:
        - name: tls-certs
          secret:
            secretName: wfl-www-tls
        - name: tmp
          emptyDir: {}
        - name: picowal-data
          persistentVolumeClaim:
            claimName: wfl-www-picowal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wfl-www-picowal
  namespace: wfl-www
  labels:
    app: wfl-www
    env: prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wfl-www
  namespace: wfl-www
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: wfl-www
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: http-redirect
      port: 80
      targetPort: 8080
      protocol: TCP
---
# cert-manager renews the wfl-www-tls secret via DNS-01 (azureDNS).
# Switched from letsencrypt-prod (HTTP-01) because DNS now points at
# picoweb's LB IP, not at the nginx ingress controller, so HTTP-01
# challenges can no longer be served. DNS-01 issuer is provisioned
# out-of-band — see k8s/wfl-www-staging.yaml for details.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wfl-www-tls
  namespace: wfl-www
spec:
  secretName: wfl-www-tls
  issuerRef:
    name: letsencrypt-prod-dns01
    kind: ClusterIssuer
  dnsNames:
    - www.wavefunctionlabs.com
    - wavefunctionlabs.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
