apiVersion: apps/v1
kind: Deployment
metadata:
  name: wfl-www
  namespace: wfl-www
  labels:
    app: wfl-www
spec:
  replicas: 1
  strategy:
    # NOTE: Recreate is needed because:
    #  - this 2-node cluster is at ~99% CPU requested already (the picoweb
    #    worker reserves 500m+ and there is nowhere for a surge pod), AND
    #  - the AF_XDP socket is bound to the pod's veth eth0; only one
    #    process per netns can own the XDP map. RollingUpdate on a single-
    #    replica deploy means the new pod must Ready before the old goes
    #    Terminating, so we'd briefly have both contending for the same
    #    XDP attachment if it ever scheduled.
    # Once the cluster has more nodes (or a 3rd worker), bump replicas to
    # >=2 and switch to RollingUpdate maxUnavailable:0 maxSurge:1 to gain
    # burst-handshake capacity (single-replica AF_XDP currently drops
    # ~33% of fresh handshakes when 6+ arrive in parallel).
    type: Recreate
  selector:
    matchLabels:
      app: wfl-www
  template:
    metadata:
      labels:
        app: wfl-www
    spec:
      containers:
        - name: wfl-www
          image: tileforgeacr.azurecr.io/wfl-www:p7-revert-batched
          ports:
            - containerPort: 443
          securityContext:
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
                - BPF
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          # Probes do a real HTTPS GET (httpGet, not tcpSocket) so that a
          # wedged userspace TLS engine — which can keep accepting SYNs
          # while RST-ing every handshake — actually fails the probe and
          # triggers a restart. kubelet runs the probe from the node's net
          # namespace, so the request reaches the pod via eth0 where the
          # AF_XDP-bound TLS engine is listening (loopback would miss it).
          # Host header is set explicitly because picoweb returns 409 on
          # missing/unknown Host (and httpGet only treats <400 as success).
          # Probes: tcpSocket on :443 (NOT httpGet). httpGet would force a
          # full TLS 1.3 handshake every 10s on the single AF_XDP worker;
          # while the worker is mid-probe, concurrent user SYNs get
          # dropped at the XDP RX ring. tcpSocket only verifies that the
          # userspace TCP stack accepts a SYN, which is what we actually
          # need from a probe (process is alive and the AF_XDP socket is
          # bound). It does NOT catch the rare TLS-engine wedge — that's
          # OK; the wedge is a 1-in-thousands event and is observable in
          # logs (`tls: RESET step failed`).
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # NOTE: picoweb's TLS worker busy-polls the AF_XDP RX ring (no
            # blocking syscall), so it pegs ~1 core. With a CPU limit, CFS
            # bandwidth control throttles the thread for 80ms out of every
            # 100ms period, producing the classic 12ms/80ms alternating
            # tail-latency pattern. We request a full core and DELIBERATELY
            # set NO cpu limit so the kernel doesn't throttle the spinner.
            # (memory limit retained.)
            requests:
              # 500m (down from 1000m): this 2-node cluster is fully
              # subscribed and a 1000m request was the only thing
              # blocking >1 replica from scheduling. Picoweb still
              # busy-polls AF_XDP and uses ~1 full core at runtime;
              # the request controls scheduling only and there is
              # intentionally no CPU limit, so no CFS throttling.
              cpu: 500m
              memory: 32Mi
            limits:
              memory: 128Mi
        # ---- HTTP -> HTTPS redirect sidecar -----------------------------
        # picoweb only listens on :443 (AF_XDP-bound). Without something on
        # :80, anyone typing 'wavefunctionlabs.com' in a browser hits a
        # 5+ second TCP timeout before HSTS kicks in (and first-time
        # visitors don't have HSTS cached). nginx sidecar 301s everything
        # to https with a tiny config — no shared state with picoweb,
        # tiny RSS, listens on a different port so AF_XDP doesn't see it.
        - name: redirect
          image: tileforgeacr.azurecr.io/nginx:alpine
          ports:
            - containerPort: 80
          command:
            - sh
            - -c
            - |
              cat >/etc/nginx/conf.d/default.conf <<'EOF'
              server {
                listen 80 default_server;
                server_name _;
                return 301 https://$host$request_uri;
              }
              EOF
              exec nginx -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /
              port: 80
              httpHeaders:
                - name: Host
                  value: wavefunctionlabs.com
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
      volumes:
        - name: tls-certs
          secret:
            secretName: wfl-www-tls
---
apiVersion: v1
kind: Service
metadata:
  name: wfl-www
  namespace: wfl-www
spec:
  type: LoadBalancer
  selector:
    app: wfl-www
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: http-redirect
      port: 80
      targetPort: 80
      protocol: TCP
---
# Keep a minimal Certificate resource so cert-manager continues to
# renew the wfl-www-tls secret even without an Ingress.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wfl-www-tls
  namespace: wfl-www
spec:
  secretName: wfl-www-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - www.wavefunctionlabs.com
    - wavefunctionlabs.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wfl-www-scores
  namespace: wfl-www
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
