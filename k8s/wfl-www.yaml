apiVersion: apps/v1
kind: Deployment
metadata:
  name: wfl-www
  namespace: wfl-www
  labels:
    app: wfl-www
    env: prod
spec:
  replicas: 1
  strategy:
    # Inline kernel-socket TLS (no AF_XDP map contention any more), so
    # RollingUpdate is safe — fresh pod can bind :443 in its own netns
    # concurrently with the old one. maxUnavailable:0 + maxSurge:1 keeps
    # the site up across rolls.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wfl-www
  template:
    metadata:
      labels:
        app: wfl-www
        env: prod
    spec:
      # Hardening: non-root + read-only rootfs + minimal caps. picoweb
      # binds :443 directly so it needs CAP_NET_BIND_SERVICE; everything
      # else is dropped (no NET_RAW/NET_ADMIN/BPF — kernel-socket TLS
      # has no use for them; they were left over from the AF_XDP era).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wfl-www
          image: tileforgeacr.azurecr.io/wfl-www:p10e-essay
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 443
              name: https
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # tcpSocket probe: cheap, doesn't churn a full TLS handshake
          # every 10s, verifies the listener is accepting. A wedged TLS
          # engine would still pass — accepted; the wedge is rare and
          # visible in logs.
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Kernel-socket TLS is epoll-driven, not busy-polling, so
            # CFS throttling is no longer a hazard. CPU limit deliberately
            # left unset to preserve burst headroom (memory limit retained).
            requests:
              cpu: 200m
              memory: 32Mi
            limits:
              memory: 128Mi
        # ---- HTTP -> HTTPS redirect sidecar -----------------------------
        # picoweb only listens on :443. Without something on :80, anyone
        # typing 'wavefunctionlabs.com' in a browser hits a 5+ second TCP
        # timeout before HSTS kicks in. Tiny nginx 301s everything.
        - name: redirect
          image: tileforgeacr.azurecr.io/nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/nginx/client_body /tmp/nginx/proxy /tmp/nginx/fastcgi /tmp/nginx/uwsgi /tmp/nginx/scgi
              cat >/tmp/nginx.conf <<'EOF'
              worker_processes 1;
              pid /tmp/nginx.pid;
              error_log /dev/stderr warn;
              events { worker_connections 256; }
              http {
                access_log off;
                client_body_temp_path /tmp/nginx/client_body;
                proxy_temp_path /tmp/nginx/proxy;
                fastcgi_temp_path /tmp/nginx/fastcgi;
                uwsgi_temp_path /tmp/nginx/uwsgi;
                scgi_temp_path /tmp/nginx/scgi;
                server {
                  listen 8080 default_server;
                  server_name _;
                  return 301 https://$host$request_uri;
                }
              }
              EOF
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              httpHeaders:
                - name: Host
                  value: wavefunctionlabs.com
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
      volumes:
        - name: tls-certs
          secret:
            secretName: wfl-www-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wfl-www
  namespace: wfl-www
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: wfl-www
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: http-redirect
      port: 80
      targetPort: 8080
      protocol: TCP
---
# cert-manager renews the wfl-www-tls secret via DNS-01 (azureDNS).
# Switched from letsencrypt-prod (HTTP-01) because DNS now points at
# picoweb's LB IP, not at the nginx ingress controller, so HTTP-01
# challenges can no longer be served. DNS-01 issuer is provisioned
# out-of-band — see k8s/wfl-www-staging.yaml for details.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wfl-www-tls
  namespace: wfl-www
spec:
  secretName: wfl-www-tls
  issuerRef:
    name: letsencrypt-prod-dns01
    kind: ClusterIssuer
  dnsNames:
    - www.wavefunctionlabs.com
    - wavefunctionlabs.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wfl-www-scores
  namespace: wfl-www
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
