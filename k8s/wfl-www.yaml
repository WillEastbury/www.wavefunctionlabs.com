apiVersion: apps/v1
kind: Deployment
metadata:
  name: wfl-www
  namespace: wfl-www
  labels:
    app: wfl-www
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wfl-www
  template:
    metadata:
      labels:
        app: wfl-www
    spec:
      containers:
        - name: wfl-www
          image: tileforgeacr.azurecr.io/wfl-www:v18rsa10
          ports:
            - containerPort: 443
          securityContext:
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
                - BPF
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: tls-certs
          secret:
            secretName: wfl-www-tls
---
apiVersion: v1
kind: Service
metadata:
  name: wfl-www
  namespace: wfl-www
spec:
  type: LoadBalancer
  selector:
    app: wfl-www
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
# Keep a minimal Certificate resource so cert-manager continues to
# renew the wfl-www-tls secret even without an Ingress.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wfl-www-tls
  namespace: wfl-www
spec:
  secretName: wfl-www-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - www.wavefunctionlabs.com
    - wavefunctionlabs.com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wfl-www-scores
  namespace: wfl-www
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
