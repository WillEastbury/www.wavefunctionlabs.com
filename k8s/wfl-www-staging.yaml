---
apiVersion: v1
kind: Namespace
metadata:
  name: wfl-www-staging
---
# cert-manager DNS-01 (azureDNS) issues the cert from Let's Encrypt prod.
# DNS-01 chosen over HTTP-01 because HTTP-01 would route the challenge
# through the cluster nginx ingress, defeating the point of staging the
# inline-TLS picoweb path. ClusterIssuer letsencrypt-prod-dns01 is
# provisioned out-of-band (Azure SP `cert-manager-dns01-wfl` scoped to
# the wavefunctionlabs.com zone; credentials in Secret azuredns-sp in
# the cert-manager namespace — NOT committed to git).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wfl-www-staging-tls
  namespace: wfl-www-staging
spec:
  secretName: wfl-www-staging-tls
  issuerRef:
    name: letsencrypt-prod-dns01
    kind: ClusterIssuer
  dnsNames:
    - staging.wavefunctionlabs.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wfl-www-staging
  namespace: wfl-www-staging
  labels:
    app: wfl-www-staging
    env: staging
spec:
  replicas: 1
  strategy:
    # Kernel-socket TLS supports SO_REUSEPORT, so RollingUpdate is safe
    # (no AF_XDP map contention any more). maxUnavailable:0 keeps staging
    # available across image rolls; maxSurge:1 lets a fresh pod come up
    # before the old one drains.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wfl-www-staging
  template:
    metadata:
      labels:
        app: wfl-www-staging
        env: staging
    spec:
      # Hardening: non-root + read-only rootfs. picoweb binds :443 directly
      # so it needs CAP_NET_BIND_SERVICE; we grant only that and drop all
      # other caps (no NET_RAW/NET_ADMIN/BPF — kernel-socket TLS doesn't
      # need them).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wfl-www
          image: tileforgeacr.azurecr.io/wfl-www:p10f-essay
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 443
              name: https
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # kernel-socket TLS: tcpSocket probe is sufficient and cheap.
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Staging gets a smaller slice so it can coexist with prod on
            # this 2-node cluster (prod node already at 99% requested).
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
        - name: redirect
          image: tileforgeacr.azurecr.io/nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/nginx/client_body /tmp/nginx/proxy /tmp/nginx/fastcgi /tmp/nginx/uwsgi /tmp/nginx/scgi
              cat >/tmp/nginx.conf <<'EOF'
              worker_processes 1;
              pid /tmp/nginx.pid;
              error_log /dev/stderr warn;
              events { worker_connections 256; }
              http {
                access_log off;
                client_body_temp_path /tmp/nginx/client_body;
                proxy_temp_path /tmp/nginx/proxy;
                fastcgi_temp_path /tmp/nginx/fastcgi;
                uwsgi_temp_path /tmp/nginx/uwsgi;
                scgi_temp_path /tmp/nginx/scgi;
                server {
                  listen 8080 default_server;
                  server_name _;
                  return 301 https://$host$request_uri;
                }
              }
              EOF
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              httpHeaders:
                - name: Host
                  value: staging.wavefunctionlabs.com
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
      volumes:
        - name: tls-certs
          secret:
            secretName: wfl-www-staging-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wfl-www-staging
  namespace: wfl-www-staging
  labels:
    app: wfl-www-staging
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: wfl-www-staging
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: http-redirect
      port: 80
      targetPort: 8080
      protocol: TCP
